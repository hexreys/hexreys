<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VMProtect research laboratories</title>
  <desc id="desc">Memory integrity reconstruction and protected resource analysis.</desc>
  <rect width="1200" height="360" rx="10" fill="#030303"/>

  <defs>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="left-card"><rect x="48" y="82" width="528" height="220" rx="10"/></clipPath>
    <clipPath id="right-card"><rect x="624" y="82" width="528" height="220" rx="10"/></clipPath>
  </defs>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#FFFFFF">
    <text x="48" y="48" font-size="16" letter-spacing="4" opacity=".58">SELECTED PROTECTOR RESEARCH / 02 ACTIVE LABS</text>

    <g>
      <rect x="48" y="82" width="528" height="220" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".25"/>
      <path d="M48 111H576" stroke="url(#scan)" stroke-width="2" clip-path="url(#left-card)">
        <animateTransform attributeName="transform" type="translate" values="-528 0;528 0" dur="3.8s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(76 82)">
        <text y="50" font-size="15" letter-spacing="3" opacity=".55">01 / MEMORY INTEGRITY</text>
        <text y="98" font-size="30" font-weight="700">MEMORY CHECKS</text>
        <text y="135" font-size="17" opacity=".75">IMAGE · DISK · CRC REPLAY</text>
        <path d="M0 177H272" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8">
          <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <text y="202" font-size="13" opacity=".45">RANGE RECORDS / COVERAGE MAP</text>
      </g>
      <g transform="translate(520 111)" stroke="#FFFFFF" fill="none" opacity=".42">
        <circle r="24" stroke-dasharray="4 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></circle>
        <circle r="8" fill="#FFFFFF" fill-opacity=".18"/>
      </g>
    </g>

    <g>
      <rect x="624" y="82" width="528" height="220" rx="10" fill="#131313" stroke="#FFFFFF" stroke-opacity=".25"/>
      <path d="M624 111H1152" stroke="url(#scan)" stroke-width="2" clip-path="url(#right-card)">
        <animateTransform attributeName="transform" type="translate" values="-528 0;528 0" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
      </path>
      <g transform="translate(652 82)">
        <text y="50" font-size="15" letter-spacing="3" opacity=".55">02 / RESOURCE PROTECTION</text>
        <text y="98" font-size="30" font-weight="700">RESOURCE LAYER</text>
        <text y="135" font-size="17" opacity=".75">TREE · API HOOKS · CACHE</text>
        <path d="M0 177H272" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8">
          <animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <text y="202" font-size="13" opacity=".45">NAMES / PAYLOADS / DLL DETACH</text>
      </g>
      <g transform="translate(1095 108)" stroke="#FFFFFF" fill="none" opacity=".42">
        <path d="M0 0V38M0 12H-18M0 25H18M-18 12V27M18 25V40"/>
        <circle cx="-18" cy="31" r="4" fill="#FFFFFF"/>
        <circle cx="18" cy="44" r="4" fill="#FFFFFF"/>
        <circle cy="42" r="4" fill="#FFFFFF"/>
        <animate attributeName="opacity" values=".25;.7;.25" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
